[project]
name = "potentiostat-scripts"
version = "0.1.0"
description = "Admiral Squidstat CA, EIS, and chopped-illumination experiment scripts"
readme = "README.md"
requires-python = ">=3.9,<3.13"
dependencies = [
    "PySide6==6.7.3; sys_platform == 'win32' and platform_machine == 'AMD64'",
    "PySide6>=6.5,<6.10; sys_platform != 'win32' or platform_machine != 'AMD64'",
    "pyserial>=3.5",
    "SquidstatPyLibrary @ https://raw.githubusercontent.com/Admiral-Instruments/AdmiralSquidstatAPI/refs/heads/main/SquidstatLibrary/windows/pythonWrapper/squidstatpylibrary-1.12.0.1-py3-none-win_amd64.whl ; sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.uv]
package = false
